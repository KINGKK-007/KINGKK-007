name: Refresh profile visuals

on:
  schedule:
    # Twice a day, at 00:00 and 12:00 UTC.
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"
      - "README.md"
      - "assets/**"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out profile scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate light and dark animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#287d60&color_dots=#eef2ef,#d4e8dc,#a4ceb7,#69ac8b,#347a5b
            dist/snake-dark.svg?palette=github-dark&color_snake=#c5f5df&color_dots=#16221c,#294535,#427056,#6ba287,#9bd8bc

      - name: Refresh activity and language cards
        run: |
          python3 -m venv "$RUNNER_TEMP/profile-typography"
          "$RUNNER_TEMP/profile-typography/bin/pip" install --disable-pip-version-check -r scripts/requirements.txt
          PYTHONPATH=scripts "$RUNNER_TEMP/profile-typography/bin/python" -m unittest discover -s scripts/tests -v
          "$RUNNER_TEMP/profile-typography/bin/python" scripts/profile_stats.py --username "$PROFILE_USERNAME" --output dist --snake-dir dist
        env:
          PROFILE_USERNAME: ${{ github.repository_owner }}
          GH_PROFILE_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify generated assets
        run: |
          test -s dist/snake.svg
          test -s dist/snake-dark.svg
          test -s dist/overview.svg
          test -s dist/overview-mobile.svg
          test -s dist/overview-compact.svg
          test -s dist/contributions.svg
          test -s dist/contributions-mobile.svg
          test -s dist/contributions-compact.svg

      - name: Publish profile visuals to the output branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
          jekyll: false
          commit_message: "Refresh contribution snake and profile stats"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update the self-hosted README snapshots
        env:
          PROFILE_BRANCH: main
        run: |
          # A newer design commit should be rendered by its own workflow run.
          git fetch origin "$PROFILE_BRANCH"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$PROFILE_BRANCH")" ]; then
            echo "A newer main commit exists; leave its snapshots to the newer run."
            exit 0
          fi
          cp dist/overview.svg dist/overview-mobile.svg dist/overview-compact.svg dist/contributions.svg dist/contributions-mobile.svg dist/contributions-compact.svg dist/snapshot.json assets/stats/
          if git diff --quiet -- assets/stats; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats/
          git commit -m "Refresh public profile snapshots"
          git push origin "HEAD:$PROFILE_BRANCH"
