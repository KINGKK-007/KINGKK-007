name: Generate contribution snake

on:
  schedule:
    # Twice a day, at 00:00 and 12:00 UTC.
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"
      - "README.md"
      - "assets/**"

permissions:
  contents: read

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate light and dark animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#287d60&color_dots=#eef2ef,#d4e8dc,#a4ceb7,#69ac8b,#347a5b
            dist/snake-dark.svg?palette=github-dark&color_snake=#c4f0da&color_dots=#161e1a,#243e32,#37644e,#579374,#9bd8bc

      - name: Verify generated assets
        run: |
          test -s dist/snake.svg
          test -s dist/snake-dark.svg

      - name: Publish animations to the output branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
          jekyll: false
          commit_message: "Refresh contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
